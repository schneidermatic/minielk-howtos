server.host: "0.0.0.0"
telemetry.enabled: "true"
xpack.fleet.packages:
  - name: fleet_server
    version: latest
  - name: system
    version: latest
xpack.fleet.outputs:
  - id: default-output
    name: default
    type: elasticsearch
    hosts: ["https://es01:9200"]
    is_default: true
    is_default_monitoring: true
    ssl:
      certificate_authorities: ["/certs/ca/ca.crt"]
xpack.fleet.agentPolicies:
  - name: Fleet-Server-Policy
    id: fleet-server-policy
    namespace: default
    monitoring_enabled: []
    package_policies:
      - name: fleet_server-1
        package:
          name: fleet_server
  - name: Elastic-Agent-Policy
    id: elastic-agent-policy
    namespace: default
    monitoring_enabled:
      - logs
      - metrics
    package_policies:
      - name: system-1
        package:
          name: system
